<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JM Investment Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
    }
  </style>
</head>
<body class="bg-black text-white font-sans min-h-screen pb-20">

  <!-- Fullscreen Auth Screen (Matches Screenshot Design) -->
  <div id="auth-modal" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center p-6 overflow-y-auto">
    <div class="w-full max-w-sm space-y-6 text-center">
      
      <!-- Brand Logo Card -->
      <div class="mx-auto w-28 h-28 bg-white rounded-2xl flex flex-col items-center justify-center p-3 shadow-lg">
        <svg class="w-12 h-12 text-black mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span class="text-xs font-black text-black tracking-tight leading-none">JM Investments</span>
      </div>

      <!-- Heading -->
      <h2 id="auth-title" class="text-2xl font-serif font-bold text-white tracking-wide">Welcome</h2>

      <!-- Error / Alert Banner -->
      <div id="auth-error" class="hidden p-3 bg-red-950/80 border border-red-800 rounded-lg text-red-300 text-xs font-medium text-center"></div>

      <!-- Auth Form -->
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4 text-left">
        
        <!-- Phone Number Input -->
        <div class="relative">
          <div id="phone-icon" class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 hidden">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
          </div>
          <input id="auth-username" type="text" required placeholder="Phone number" class="w-full bg-black border border-slate-700 rounded-xl py-3.5 px-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 font-sans">
        </div>

        <!-- Password Input -->
        <div class="relative">
          <div id="pass-icon" class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 hidden">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
          </div>
          <input id="auth-password" type="password" required placeholder="Set Password" class="w-full bg-black border border-slate-700 rounded-xl py-3.5 px-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Confirm Password Input (Register only) -->
        <div id="confirm-pass-container" class="relative">
          <input id="auth-confirm-password" type="password" placeholder="Confirm Password" class="w-full bg-black border border-slate-700 rounded-xl py-3.5 px-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Invitation Code Input (Register only) -->
        <div id="invite-code-container" class="relative">
          <input id="auth-invite-code" type="text" placeholder="Invitation Code" class="w-full bg-black border border-slate-700 rounded-xl py-3.5 px-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Submit Button -->
        <button id="auth-submit-btn" type="submit" class="w-full bg-black border border-blue-500 hover:bg-blue-600/10 text-blue-400 hover:text-blue-300 text-base font-semibold py-3.5 rounded-xl transition duration-200 mt-2">
          Register
        </button>
      </form>

      <!-- Bottom Navigation Links -->
      <div class="flex items-center justify-between pt-2 text-xs text-slate-300">
        <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="hover:underline flex items-center gap-1 font-serif">
          Login
        </button>
        <button id="forgot-pass-btn" onclick="alert('Please contact support to reset your password.')" class="hover:underline hidden font-serif text-slate-400">
          Forgot your password?
        </button>
      </div>

    </div>
  </div>

  <!-- Top Navigation Header -->
  <header class="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-40 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-blue-500">JM Investments</h1>
      <p id="user-display" class="text-xs text-slate-400">Guest User</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openDepositModal('General Deposit')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
        + Deposit
      </button>
      <button onclick="logout()" class="bg-slate-900 border border-slate-700 hover:bg-rose-600 text-slate-300 hover:text-white text-xs font-semibold px-2.5 py-2 rounded-lg transition">
        Exit
      </button>
    </div>
  </header>

  <!-- Category Filter Tabs -->
  <nav class="flex border-b border-slate-800 bg-black px-4 pt-2 text-sm font-medium overflow-x-auto space-x-6 text-slate-400 no-scrollbar">
    <button onclick="filterSeries('all')" class="tab-btn pb-2 border-b-2 border-blue-500 text-blue-500 font-bold whitespace-nowrap">All</button>
    <button onclick="filterSeries('W')" class="tab-btn pb-2 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap">W series</button>
    <button onclick="filterSeries('K')" class="tab-btn pb-2 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap">K series</button>
    <button onclick="filterSeries('A')" class="tab-btn pb-2 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap">A series</button>
  </nav>

  <!-- Package List Container -->
  <main class="p-4 max-w-2xl mx-auto space-y-4" id="package-list">
    <!-- Dynamic Cards Render Here -->
  </main>

  <!-- Bottom Navigation Bar -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 flex justify-around py-2 text-xs text-slate-400 z-40">
    <button class="flex flex-col items-center hover:text-blue-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"></path></svg>
      <span>Home</span>
    </button>
    <button class="flex flex-col items-center text-blue-500 font-bold">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
      <span>AI Miners</span>
    </button>
    <button class="flex flex-col items-center hover:text-blue-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      <span>Team</span>
    </button>
    <button class="flex flex-col items-center hover:text-blue-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
      <span>Income</span>
    </button>
    <button onclick="alert('Account User: ' + (localStorage.getItem('jm_active_user') || 'Not logged in'))" class="flex flex-col items-center hover:text-blue-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>My</span>
    </button>
  </footer>

  <!-- Deposit Modal -->
  <div id="deposit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <button onclick="closeDepositModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
      
      <h3 class="text-xl font-bold text-white mb-1">Deposit Funds</h3>
      <p class="text-xs text-slate-400 mb-4">Package: <span id="modal-asset-name" class="text-blue-400 font-semibold">General</span></p>

      <!-- Network Selection -->
      <label class="block text-xs text-slate-400 mb-2 font-medium">Select Payment Method</label>
      <select id="network-select" onchange="handleNetworkChange()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white mb-4 focus:outline-none focus:border-blue-500">
        <option value="momo">Mobile Money (MTN / Airtel)</option>
        <option value="usdt">USDT (TRC20)</option>
      </select>

      <!-- Mobile Money Numbers -->
      <div id="momo-container" class="space-y-3 mb-6">
        <div>
          <label class="block text-xs text-yellow-500 font-semibold mb-1">MTN Mobile Money</label>
          <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-3">
            <input id="mtn-num" type="text" readonly value="0762892685" class="bg-transparent text-sm text-slate-200 w-full outline-none font-mono" />
            <button onclick="copyText('mtn-num', 'MTN number')" class="text-xs bg-yellow-600 hover:bg-yellow-500 text-white font-semibold px-3 py-1.5 rounded transition">Copy</button>
          </div>
        </div>

        <div>
          <label class="block text-xs text-red-500 font-semibold mb-1">Airtel Money</label>
          <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-3">
            <input id="airtel-num" type="text" readonly value="0705150846" class="bg-transparent text-sm text-slate-200 w-full outline-none font-mono" />
            <button onclick="copyText('airtel-num', 'Airtel number')" class="text-xs bg-red-600 hover:bg-red-500 text-white font-semibold px-3 py-1.5 rounded transition">Copy</button>
          </div>
        </div>
      </div>

      <!-- Crypto Container -->
      <div id="crypto-container" class="hidden mb-6">
        <label class="block text-xs text-slate-400 mb-2 font-medium">USDT TRC20 Address</label>
        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-3">
          <input id="crypto-address" type="text" readonly value="TYDzsYbc23x55678abcdef9012345678" class="bg-transparent text-xs text-slate-300 w-full outline-none pr-2 font-mono" />
          <button onclick="copyText('crypto-address', 'Address')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1.5 rounded transition whitespace-nowrap">Copy</button>
        </div>
      </div>

      <button onclick="closeDepositModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold py-2.5 rounded-lg transition">
        Done
      </button>
    </div>
  </div>

  <script>
    let isRegisterMode = true;

    const packages = [
      { series: 'W', name: 'W-1', days: 25, price: 50000, income: 375000 },
      { series: 'W', name: 'W-2', days: 25, price: 150000, income: 1162500 },
      { series: 'W', name: 'W-3', days: 25, price: 250000, income: 2000000 },
      { series: 'W', name: 'W-4', days: 25, price: 500000, income: 4125000 },
      { series: 'W', name: 'W-5', days: 25, price: 1500000, income: 12750000 },
      { series: 'K', name: 'K-1', days: 30, price: 100000, income: 900000 },
      { series: 'K', name: 'K-2', days: 30, price: 300000, income: 2700000 },
      { series: 'A', name: 'A-1', days: 15, price: 20000, income: 120000 }
    ];

    function getAccounts() {
      return JSON.parse(localStorage.getItem('jm_accounts')) || {};
    }

    function checkAuthStatus() {
      const activeUser = localStorage.getItem('jm_active_user');
      if (activeUser) {
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('user-display').innerText = 'User: ' + activeUser;
      } else {
        document.getElementById('auth-modal').classList.remove('hidden');
      }
    }

    function showError(message) {
      const errorBox = document.getElementById('auth-error');
      errorBox.innerText = message;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      const errorBox = document.getElementById('auth-error');
      errorBox.classList.add('hidden');
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      hideError();

      const title = document.getElementById('auth-title');
      const submitBtn = document.getElementById('auth-submit-btn');
      const toggleBtn = document.getElementById('auth-toggle-btn');
      const forgotBtn = document.getElementById('forgot-pass-btn');
      const confirmContainer = document.getElementById('confirm-pass-container');
      const inviteContainer = document.getElementById('invite-code-container');
      const passInput = document.getElementById('auth-password');
      const phoneInput = document.getElementById('auth-username');
      const phoneIcon = document.getElementById('phone-icon');
      const passIcon = document.getElementById('pass-icon');

      if (isRegisterMode) {
        title.innerText = 'Welcome';
        title.classList.remove('hidden');
        submitBtn.innerText = 'Register';
        toggleBtn.innerText = 'Login';
        forgotBtn.classList.add('hidden');
        confirmContainer.classList.remove('hidden');
        inviteContainer.classList.remove('hidden');
        passInput.placeholder = 'Set Password';
        phoneInput.placeholder = 'Phone number';
        
        phoneInput.classList.remove('pl-11');
        passInput.classList.remove('pl-11');
        phoneIcon.classList.add('hidden');
        passIcon.classList.add('hidden');
      } else {
        title.classList.add('hidden');
        submitBtn.innerText = 'Login';
        toggleBtn.innerHTML = '‹ Register';
        forgotBtn.classList.remove('hidden');
        confirmContainer.classList.add('hidden');
        inviteContainer.classList.add('hidden');
        passInput.placeholder = 'Login Password';
        phoneInput.placeholder = 'Phone Number';

        phoneInput.classList.add('pl-11');
        passInput.classList.add('pl-11');
        phoneIcon.classList.remove('hidden');
        passIcon.classList.remove('hidden');
      }
    }

    function handleAuth(event) {
      event.preventDefault();
      hideError();

      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;
      const accounts = getAccounts();

      if (isRegisterMode) {
        const confirmPass = document.getElementById('auth-confirm-password').value;

        if (password !== confirmPass) {
          showError("Passwords do not match!");
          return;
        }

        if (accounts[username]) {
          showError("Account already exists! Please login.");
          return;
        }

        accounts[username] = password;
        localStorage.setItem('jm_accounts', JSON.stringify(accounts));
        localStorage.setItem('jm_active_user', username);
        
        checkAuthStatus();
      } else {
        if (!accounts[username]) {
          showError("Account not registered");
          return;
        }

        if (accounts[username] !== password) {
          showError("Incorrect password. Check the password and try again.");
          return;
        }

        localStorage.setItem('jm_active_user', username);
        checkAuthStatus();
      }
    }

    function logout() {
      localStorage.removeItem('jm_active_user');
      hideError();
      checkAuthStatus();
    }

    function renderPackages(filter = 'all') {
      const container = document.getElementById('package-list');
      container.innerHTML = '';

      const filtered = filter === 'all' ? packages : packages.filter(p => p.series === filter);

      filtered.forEach(pkg => {
        container.innerHTML += `
          <div class="bg-slate-900 border border-blue-500/40 rounded-xl overflow-hidden shadow-lg flex items-center p-3 gap-4 hover:border-blue-500 transition">
            <div class="w-28 h-28 bg-black rounded-lg flex-shrink-0 flex items-center justify-center border border-slate-800 p-2">
              <div class="text-center">
                <div class="text-xs font-bold text-blue-400 bg-blue-500/10 px-2 py-1 rounded border border-blue-500/20 mb-1">JM</div>
                <div class="text-[10px] text-slate-500">AI Miner Unit</div>
              </div>
            </div>

            <div class="flex-grow space-y-1">
              <h3 class="text-lg font-bold text-blue-400">${pkg.name}</h3>
              <p class="text-xs text-slate-300">Lock: <span class="text-slate-100 font-semibold">${pkg.days} Days</span></p>
              <p class="text-xs text-slate-300">Price: <span class="text-slate-100 font-semibold">UGX ${pkg.price.toLocaleString()}</span></p>
              <p class="text-xs text-slate-300">Total income: <span class="text-slate-100 font-semibold">UGX ${pkg.income.toLocaleString()}</span></p>
              
              <button onclick="openDepositModal('${pkg.name} - UGX ${pkg.price.toLocaleString()}')" class="mt-2 w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-1.5 rounded transition">
                Buy Miner
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterSeries(series) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'text-blue-500', 'font-bold');
        btn.classList.add('border-transparent');
      });
      event.target.classList.add('border-blue-500', 'text-blue-500', 'font-bold');
      event.target.classList.remove('border-transparent');
      
      renderPackages(series);
    }

    function handleNetworkChange() {
      const selected = document.getElementById('network-select').value;
      const momoContainer = document.getElementById('momo-container');
      const cryptoContainer = document.getElementById('crypto-container');

      if (selected === 'momo') {
        momoContainer.classList.remove('hidden');
        cryptoContainer.classList.add('hidden');
      } else {
        momoContainer.classList.add('hidden');
        cryptoContainer.classList.remove('hidden');
      }
    }

    function openDepositModal(assetName) {
      document.getElementById('modal-asset-name').innerText = assetName;
      document.getElementById('deposit-modal').classList.remove('hidden');
      document.getElementById('deposit-modal').classList.add('flex');
    }

    function closeDepositModal() {
      document.getElementById('deposit-modal').classList.add('hidden');
      document.getElementById('deposit-modal').classList.remove('flex');
    }

    function copyText(elementId, label) {
      const input = document.getElementById(elementId);
      navigator.clipboard.writeText(input.value);
      alert(label + ' copied to clipboard!');
    }

// Sign Up New User
async function handleSignUp(email, password) {
    const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
    });

    if (error) {
        alert('Sign up failed: ' + error.message);
    } else {
        alert('Check your email for the confirmation link!');
    }
}

// Log In Existing User
async function handleLogin(email, password) {
    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
    });

    if (error) {
        alert('Login failed: ' + error.message);
    } else {
        alert('Logged in successfully!');
        // Hide auth modal / update UI here
        document.getElementById('auth-modal')?.classList.add('hidden');
    }
}
// Check user status on page load
async function checkAuthStatus() {
    const { data: { session } } = await supabase.auth.getSession();

    if (session) {
        document.getElementById('auth-modal')?.classList.add('hidden');
    } else {
        document.getElementById('auth-modal')?.classList.remove('hidden');
    }
}

// Hook up your form submission or button clicks
document.getElementById('auth-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email-input').value;
    const password = document.getElementById('password-input').value;

    // Call handleLogin or handleSignUp depending on your UI active tab/button
    await handleLogin(email, password);
});
  // Run auth check on page load
  checkAuthStatus();
</script>
