<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JM Investment Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-20">

  <!-- Top Navigation Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-blue-500">JM Investments</h1>
      <p class="text-xs text-slate-400">Mining & Yield Packages</p>
    </div>
    <button onclick="openDepositModal('General Deposit')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
      + Deposit
    </button>
  </header>

  <!-- Category Filter Tabs -->
  <nav class="flex border-b border-slate-800 bg-slate-950 px-4 pt-2 text-sm font-medium overflow-x-auto space-x-6 text-slate-400 no-scrollbar">
    <button onclick="filterSeries('all')" class="tab-btn pb-2 border-b-2 border-blue-500 text-blue-500 font-bold whitespace-nowrap">All</button>
    <button onclick="filterSeries('W')" class="tab-btn pb-2 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap">W series</button>
    <button onclick="filterSeries('K')" class="tab-btn pb-2 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap">K series</button>
    <button onclick="filterSeries('A')" class="tab-btn pb-2 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap">A series</button>
  </nav>

  <!-- Package List Container -->
  <main class="p-4 max-w-2xl mx-auto space-y-4" id="package-list">
    <!-- Dynamic Cards Will Render Here -->
  </main>

  <!-- Bottom Navigation Bar -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around py-2 text-xs text-slate-400 z-40">
    <button class="flex flex-col items-center hover:text-blue-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"></path></svg>
      <span>Home</span>
    </button>
    <button class="flex flex-col items-center text-blue-500 font-bold">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
      <span>AI Miners</span>
    </button>
    <button class="flex flex-col items-center hover:text-blue-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      <span>Team</span>
    </button>
    <button class="flex flex-col items-center hover:text-blue-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
      <span>Income</span>
    </button>
    <button class="flex flex-col items-center hover:text-blue-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>My</span>
    </button>
  </footer>

  <!-- Deposit Modal -->
  <div id="deposit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <button onclick="closeDepositModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
      
      <h3 class="text-xl font-bold text-white mb-1">Deposit Funds</h3>
      <p class="text-xs text-slate-400 mb-4">Package: <span id="modal-asset-name" class="text-blue-400 font-semibold">General</span></p>

      <!-- Network Selection -->
      <label class="block text-xs text-slate-400 mb-2 font-medium">Select Payment Method</label>
      <select id="network-select" onchange="handleNetworkChange()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white mb-4 focus:outline-none focus:border-blue-500">
        <option value="momo">Mobile Money (MTN / Airtel)</option>
        <option value="usdt">USDT (TRC20)</option>
      </select>

      <!-- Mobile Money Numbers -->
      <div id="momo-container" class="space-y-3 mb-6">
        <div>
          <label class="block text-xs text-yellow-500 font-semibold mb-1">MTN Mobile Money</label>
          <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-3">
            <input id="mtn-num" type="text" readonly value="0762892685" class="bg-transparent text-sm text-slate-200 w-full outline-none font-mono" />
            <button onclick="copyText('mtn-num', 'MTN number')" class="text-xs bg-yellow-600 hover:bg-yellow-500 text-white font-semibold px-3 py-1.5 rounded transition">Copy</button>
          </div>
        </div>

        <div>
          <label class="block text-xs text-red-500 font-semibold mb-1">Airtel Money</label>
          <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-3">
            <input id="airtel-num" type="text" readonly value="0705150846" class="bg-transparent text-sm text-slate-200 w-full outline-none font-mono" />
            <button onclick="copyText('airtel-num', 'Airtel number')" class="text-xs bg-red-600 hover:bg-red-500 text-white font-semibold px-3 py-1.5 rounded transition">Copy</button>
          </div>
        </div>
      </div>

      <!-- Crypto Container -->
      <div id="crypto-container" class="hidden mb-6">
        <label class="block text-xs text-slate-400 mb-2 font-medium">USDT TRC20 Address</label>
        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-3">
          <input id="crypto-address" type="text" readonly value="TYDzsYbc23x55678abcdef9012345678" class="bg-transparent text-xs text-slate-300 w-full outline-none pr-2 font-mono" />
          <button onclick="copyText('crypto-address', 'Address')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1.5 rounded transition whitespace-nowrap">Copy</button>
        </div>
      </div>

      <button onclick="closeDepositModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold py-2.5 rounded-lg transition">
        Done
      </button>
    </div>
  </div>

  <script>
    const packages = [
      { series: 'W', name: 'W-1', days: 25, price: 50000, income: 375000 },
      { series: 'W', name: 'W-2', days: 25, price: 150000, income: 1162500 },
      { series: 'W', name: 'W-3', days: 25, price: 250000, income: 2000000 },
      { series: 'W', name: 'W-4', days: 25, price: 500000, income: 4125000 },
      { series: 'W', name: 'W-5', days: 25, price: 1500000, income: 12750000 },
      { series: 'K', name: 'K-1', days: 30, price: 100000, income: 900000 },
      { series: 'K', name: 'K-2', days: 30, price: 300000, income: 2700000 },
      { series: 'A', name: 'A-1', days: 15, price: 20000, income: 120000 }
    ];

    function renderPackages(filter = 'all') {
      const container = document.getElementById('package-list');
      container.innerHTML = '';

      const filtered = filter === 'all' ? packages : packages.filter(p => p.series === filter);

      filtered.forEach(pkg => {
        container.innerHTML += `
          <div class="bg-slate-900 border border-blue-500/40 rounded-xl overflow-hidden shadow-lg flex items-center p-3 gap-4 hover:border-blue-500 transition">
            <!-- Hardware Image Placeholder -->
            <div class="w-28 h-28 bg-slate-950 rounded-lg flex-shrink-0 flex items-center justify-center border border-slate-800 p-2">
              <div class="text-center">
                <div class="text-xs font-bold text-blue-400 bg-blue-500/10 px-2 py-1 rounded border border-blue-500/20 mb-1">Meta8</div>
                <div class="text-[10px] text-slate-500">AI Miner Unit</div>
              </div>
            </div>

            <!-- Details Section -->
            <div class="flex-grow space-y-1">
              <h3 class="text-lg font-bold text-blue-400">${pkg.name}</h3>
              <p class="text-xs text-slate-300">Lock: <span class="text-slate-100 font-semibold">${pkg.days} Days</span></p>
              <p class="text-xs text-slate-300">Price: <span class="text-slate-100 font-semibold">UGX ${pkg.price.toLocaleString()}</span></p>
              <p class="text-xs text-slate-300">Total income: <span class="text-slate-100 font-semibold">UGX ${pkg.income.toLocaleString()}</span></p>
              
              <button onclick="openDepositModal('${pkg.name} - UGX ${pkg.price.toLocaleString()}')" class="mt-2 w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-1.5 rounded transition">
                Buy Miner
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterSeries(series) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'text-blue-500', 'font-bold');
        btn.classList.add('border-transparent');
      });
      event.target.classList.add('border-blue-500', 'text-blue-500', 'font-bold');
      event.target.classList.remove('border-transparent');
      
      renderPackages(series);
    }

    function handleNetworkChange() {
      const selected = document.getElementById('network-select').value;
      const momoContainer = document.getElementById('momo-container');
      const cryptoContainer = document.getElementById('crypto-container');

      if (selected === 'momo') {
        momoContainer.classList.remove('hidden');
        cryptoContainer.classList.add('hidden');
      } else {
        momoContainer.classList.add('hidden');
        cryptoContainer.classList.remove('hidden');
      }
    }

    function openDepositModal(assetName) {
      document.getElementById('modal-asset-name').innerText = assetName;
      document.getElementById('deposit-modal').classList.remove('hidden');
      document.getElementById('deposit-modal').classList.add('flex');
    }

    function closeDepositModal() {
      document.getElementById('deposit-modal').classList.add('hidden');
      document.getElementById('deposit-modal').classList.remove('flex');
    }

    function copyText(elementId, label) {
      const input = document.getElementById(elementId);
      navigator.clipboard.writeText(input.value);
      alert(label + ' copied to clipboard!');
    }

    renderPackages('all');
  </script>
</body>
        </html>
